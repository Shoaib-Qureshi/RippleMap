name: Release
# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to publish. See RELEASING.md for the one-time setup.
on:
  push:
    tags: ['v*']

jobs:
  test:
    uses: ./.github/workflows/ci.yml # Ubuntu + Windows: nothing ships without passing both

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release with the .vsix
      id-token: write # VS Code Marketplace Trusted Publishing (OIDC): no stored token
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }} # optional: without it, Open VSX is skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - run: npm run build

      - name: Package (README links and images point at this tag on GitHub)
        run: >
          npx vsce package --no-dependencies --allow-missing-repository -o ripplemap.vsix
          --baseContentUrl "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          --baseImagesUrl "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --packagePath ripplemap.vsix

      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium)
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.3.0 publish ripplemap.vsix -p "$OVSX_PAT"

      - name: GitHub release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ripplemap.vsix --title "${GITHUB_REF_NAME}" --generate-notes
